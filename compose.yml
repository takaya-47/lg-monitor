services:
  app:
    build:
      context: .docker/go
    volumes:
      # ソースコードをバインドマウント
      - .:/app
      # モジュール/ビルドキャッシュは名前付きボリュームで管理し、コンテナ起動を高速化する
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    tty: true
    environment:
      # gooseのCLIが参照する環境変数
      GOOSE_DRIVER: mysql
      GOOSE_DBSTRING: "root:root@tcp(mysql:3306)/lg_monitor?parseTime=true"
      GOOSE_MIGRATION_DIR: migrations
    depends_on:
      mysql:
        # MySQLが接続を受け付ける状態になるまで待つ
        condition: service_healthy
  mysql:
    image: mysql:8.4
    ports:
      # ローカルマシンからクライアントツールで接続したいので3306番ポートを公開し、コンテナの3306番ポートとマッピングする
      - "3306:3306"
    volumes:
    # 設定ファイルのバインドマウント
      - "./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf"
    # データ永続化用のボリューム
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: lg_monitor
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
      # 初回起動時はDBの初期化に時間がかかるため、その間の失敗はretriesに数えない
      start_period: 60s

volumes:
  go-mod-cache:
  go-build-cache:
  mysql-data:
