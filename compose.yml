services:
  app:
    build:
      context: .docker/go
    volumes:
      # ソースコードをバインドマウント
      - .:/app
      # モジュール/ビルドキャッシュは名前付きボリュームで管理し、コンテナ起動を高速化する
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    tty: true
    environment:
      GOOSE_DRIVER: mysql
      # goose用DSN
      # ユーザー名:パスワード@tcp(ホスト:ポート)/データベース名?parseTime=true
      GOOSE_DBSTRING: "${DB_ROOT_USER}:${DB_ROOT_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true"
      GOOSE_MIGRATION_DIR: migrations
      # アプリケーション用DSN（gooseとは別に管理）
      DB_DSN: "${DB_ROOT_USER}:${DB_ROOT_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true"
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    ports:
      # ローカルマシンからクライアントツールで接続したいのでポートを公開する。
      - "127.0.0.1:${DB_PORT_HOST}:3306"
    volumes:
    # 設定ファイルのバインドマウント
      - "./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf"
    # データ永続化用のボリューム
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # 初回起動時はDBの初期化に時間がかかるため、その間の失敗はretriesに数えない
      start_period: 60s

volumes:
  go-mod-cache:
  go-build-cache:
  mysql-data: