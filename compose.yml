services:
  monitor:
    build:
      context: .docker/go/monitor
    volumes:
      # ソースコードをバインドマウント
      - .:/app
      # モジュール/ビルドキャッシュは名前付きボリュームで管理し、コンテナ起動を高速化する
      - go-mod-cache-monitor:/go/pkg/mod
      - go-build-cache-monitor:/root/.cache/go-build
    environment:
      GOOSE_DRIVER: mysql
      # goose用DSN
      # ユーザー名:パスワード@tcp(ホスト:ポート)/データベース名?parseTime=true
      GOOSE_DBSTRING: "${DB_ROOT_USER}:${DB_ROOT_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true"
      GOOSE_MIGRATION_DIR: migrations
      # アプリケーション用DSN（gooseとは別に管理）
      DB_DSN: "${DB_ROOT_USER}:${DB_ROOT_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true"
      MONITOR_INTERVAL_MINUTES: "${MONITOR_INTERVAL_MINUTES}"
    command: ["sh", "-c", "go build -o /tmp/monitor ./cmd/monitor && /tmp/monitor"]
    depends_on:
      mysql:
        condition: service_healthy
  web:
    build:
      context: .docker/go/web
    ports:
      - "8080:8080"
    volumes:
      # ソースコードをバインドマウント
      - .:/app
      # モジュール/ビルドキャッシュは名前付きボリュームで管理し、コンテナ起動を高速化する
      - go-mod-cache-web:/go/pkg/mod
      - go-build-cache-web:/root/.cache/go-build
    environment:
      # アプリケーション用DSN（gooseとは別に管理）
      DB_DSN: "${DB_ROOT_USER}:${DB_ROOT_PASSWORD}@tcp(${DB_HOST}:${DB_PORT})/${DB_NAME}?parseTime=true"
    command: ["sh", "-c", "go build -o /tmp/web ./cmd/web && /tmp/web"]
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    ports:
      # ローカルマシンからクライアントツールで接続したいのでポートを公開する。
      - "3306:3306"
    volumes:
    # 設定ファイルのバインドマウント
      - "./.docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf"
    # データ永続化用のボリューム
      - mysql-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # 初回起動時はDBの初期化に時間がかかるため、その間の失敗はretriesに数えない
      start_period: 60s

volumes:
  go-mod-cache-monitor:
  go-build-cache-monitor:
  go-mod-cache-web:
  go-build-cache-web:
  mysql-data: